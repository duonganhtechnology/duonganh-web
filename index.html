        // Hàm bật Popup Quản Trị hoặc vào thẳng Bảng Quản Trị nếu đã đăng nhập
        async function toggleAdminAccess() {
            if (!supabaseClient) {
                showToast('Chưa kết nối Supabase!', 'error');
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {

            } else {
                document.getElementById('login-modal').classList.remove('hidden');
                switchAuthTab('login');
            }

        // Chuyển đổi qua lại giữa Tab Đăng nhập và Đăng ký
        function switchAuthTab(tab) {
            const loginForm = document.getElementById('auth-form-login');
            const signupForm = document.getElementById('auth-form-signup');
            const loginTab = document.getElementById('auth-tab-login');
            const signupTab = document.getElementById('auth-tab-signup');

            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('signup-error').classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.className = 'text-sm font-bold text-amber-400 border-b-2 border-amber-400 pb-2';
                signupTab.className = 'text-sm font-bold text-zinc-400 hover:text-white pb-2';
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupTab.className = 'text-sm font-bold text-amber-400 border-b-2 border-amber-400 pb-2';
                loginTab.className = 'text-sm font-bold text-zinc-400 hover:text-white pb-2';
            }
        }

        function closeLoginModal() {
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('signup-error').classList.add('hidden');
        }

        // Hàm Xử Lý Đăng Nhập
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const errorEl = document.getElementById('login-error');

            if (!supabaseClient) {
                showToast('Chưa kết nối Supabase!', 'error');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                let msg = error.message;
                if (msg === 'Invalid login credentials') msg = 'Email hoặc mật khẩu không chính xác!';
                if (msg.includes('Email not confirmed')) msg = 'Tài khoản chưa được kích hoạt trên Supabase!';
                errorEl.innerText = 'Lỗi: ' + msg;
                errorEl.classList.remove('hidden');
            } else {
                errorEl.classList.add('hidden');
                closeLoginModal();
                showToast('Đăng nhập Quản Trị thành công!', 'success');
                showSection('admin');
            }
        }

        // Hàm Xử Lý Đăng Ký Trực Tiếp trên Website
        async function handleSignUp(e) {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const errorEl = document.getElementById('signup-error');

            if (!supabaseClient) {
                showToast('Chưa kết nối Supabase!', 'error');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });

            if (error) {
                errorEl.innerText = 'Lỗi tạo tài khoản: ' + error.message;
                errorEl.classList.remove('hidden');
            } else if (data.user && !data.session) {

        function showSection(sectionId) {

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-amber-500 text-black' : (type === 'error' ? 'bg-red-600 text-white' : 'bg-zinc-800 text-gold-400 border border-amber-500/40');
            const icon = type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-circle-xmark' : 'fa-circle-info');

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl ${bgColor} text-xs font-bold shadow-2xl transition transform translate-y-2 opacity-0 duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function switchAdminTab(tab) {

            tabs.forEach(t => {

            if (formMap[tab]) document.getElementById(formMap[tab]).classList.remove('hidden');

        async function handleAddProduct(e) {
            e.preventDefault();
            const payload = {
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-cat').value,
                specifications: document.getElementById('p-specs').value,
                image_url: document.getElementById('p-img').value || null,
                video_url: document.getElementById('p-video').value || null
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('products').insert([payload]);
                if (error) { showToast('Lỗi Supabase: ' + error.message, 'error'); return; }
            } else {
                sampleData.products.unshift({ id: Date.now(), ...payload });
            }
            showToast('Đã thêm sản phẩm máy móc thành công!', 'success');
            e.target.reset();
            renderProducts();
        }

            showToast('Đã thêm thợ kỹ thuật thành công!', 'success');
            e.target.reset();
            renderTechnicians();
        }

        async function handleAddSupplier(e) {
            e.preventDefault();
            const payload = {
                shop_name: document.getElementById('s-name').value,
                phone: document.getElementById('s-phone').value,
                type: document.getElementById('s-type').value,
                province: document.getElementById('s-province').value,
                categories: document.getElementById('s-cats').value,
                address: document.getElementById('s-address').value
            };

            if (supabaseClient) {

            } else {
                sampleData.suppliers.unshift({ id: Date.now(), ...payload });
            }
            showToast('Đã lưu cửa hàng/nhà cung cấp mới!', 'success');
            e.target.reset();
            renderSuppliers();
        }

        async function handleAddPost(e) {
            e.preventDefault();
            const payload = {
                title: document.getElementById('post-title').value,
                category: document.getElementById('post-cat').value,
                summary: document.getElementById('post-summary').value,
                image_url: document.getElementById('post-img').value || null
            };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('posts').insert([payload]);
                if (error) { showToast('Lỗi Supabase: ' + error.message, 'error'); return; }
            } else {
                sampleData.posts.unshift({ id: Date.now(), ...payload });
            }
            showToast('Đã đăng bài viết mới thành công!', 'success');

            renderPosts();
        }

        function exportDataBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(sampleData, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `duonganh_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast('Đã xuất file dữ liệu dự phòng về máy!', 'success');
        }
